<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Simple Text Analyzer & Counter</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

  <!-- Header -->
  <header class="bg-blue-600 text-white text-center py-6 shadow">
    <h1 class="text-3xl font-bold">
      Simple Text Analyzer & Counter
    </h1>
    <p class="mt-2">
      Analyze your text instantly
    </p>
  </header>

  <!-- Main Container -->
  <main class="max-w-5xl mx-auto p-5">

    <!-- Text Editor -->
    <div class="bg-white p-6 rounded-xl shadow mt-6">

      <label for="textInput"
        class="block text-lg font-semibold mb-3">
        Enter Your Text
      </label>

      <textarea
        id="textInput"
        rows="10"
        placeholder="Start typing or paste your text here..."
        class="w-full p-4 border border-gray-300 rounded-lg
        focus:outline-none focus:ring-2 focus:ring-blue-500 resize-y">
      </textarea>

      <div class="flex gap-3 mt-4">

        <button
          id="clearBtn"
          class="bg-red-500 hover:bg-red-600 text-white
          px-5 py-2 rounded-lg">
          Clear Text
        </button>

        <button
          id="sampleBtn"
          class="bg-blue-500 hover:bg-blue-600 text-white
          px-5 py-2 rounded-lg">
          Add Sample
        </button>

      </div>
    </div>

    <!-- Result Section -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6">

      <!-- Words -->
      <div class="bg-white p-5 rounded-xl shadow text-center">
        <h2 class="text-gray-500 font-semibold">Words</h2>
        <p id="wordCount"
          class="text-3xl font-bold text-blue-600 mt-2">
          0
        </p>
      </div>

      <!-- Characters -->
      <div class="bg-white p-5 rounded-xl shadow text-center">
        <h2 class="text-gray-500 font-semibold">Characters</h2>
        <p id="characterCount"
          class="text-3xl font-bold text-green-600 mt-2">
          0
        </p>
      </div>

      <!-- Sentences -->
      <div class="bg-white p-5 rounded-xl shadow text-center">
        <h2 class="text-gray-500 font-semibold">Sentences</h2>
        <p id="sentenceCount"
          class="text-3xl font-bold text-purple-600 mt-2">
          0
        </p>
      </div>

      <!-- Reading Time -->
      <div class="bg-white p-5 rounded-xl shadow text-center">
        <h2 class="text-gray-500 font-semibold">Reading Time</h2>
        <p id="readingTime"
          class="text-3xl font-bold text-orange-500 mt-2">
          0 min
        </p>
      </div>

    </div>

  </main>

  <!-- Footer -->
  <footer class="text-center text-gray-500 py-6 mt-5">
    Simple Text Analyzer & Counter
  </footer>


  <!-- JavaScript -->
  <script>

    // Get HTML elements
    const textInput = document.getElementById("textInput");
    const wordCount = document.getElementById("wordCount");
    const characterCount =
      document.getElementById("characterCount");
    const sentenceCount =
      document.getElementById("sentenceCount");
    const readingTime =
      document.getElementById("readingTime");

    const clearBtn = document.getElementById("clearBtn");
    const sampleBtn = document.getElementById("sampleBtn");


    // Function to analyze text
    function analyzeText() {

      const text = textInput.value;

      // Character Count
      characterCount.textContent = text.length;


      // Word Count
      const words = text.trim() === ""
        ? []
        : text.trim().split(/\s+/);

      wordCount.textContent = words.length;


      // Sentence Count
      const sentences = text
        .split(/[.!?]+/)
        .filter(sentence => sentence.trim().length > 0);

      sentenceCount.textContent =
        text.trim() === "" ? 0 : sentences.length;


      // Reading Time
      // Average reading speed = 200 words/minute
      const minutes = words.length / 200;

      if (words.length === 0) {
        readingTime.textContent = "0 min";
      }
      else if (minutes < 1) {
        readingTime.textContent = "< 1 min";
      }
      else {
        readingTime.textContent =
          Math.ceil(minutes) + " min";
      }
    }


    // Analyze whenever user types
    textInput.addEventListener("input", analyzeText);


    // Clear Button
    clearBtn.addEventListener("click", function () {

      textInput.value = "";

      analyzeText();

      textInput.focus();

    });


    // Sample Button
    sampleBtn.addEventListener("click", function () {

      textInput.value =
        "Welcome to the Simple Text Analyzer. " +
        "This website analyzes your text instantly. " +
        "Start typing to see the results!";

      analyzeText();

    });

  </script>

</body>
</html>
